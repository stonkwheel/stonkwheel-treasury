name: Rebuild treasury

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile twice and compare with the recorded deployment
        run: bash ci/rebuild.sh

      - name: Save build results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: treasury-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-output/
          if-no-files-found: warn
          retention-days: 30

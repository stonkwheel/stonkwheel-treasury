name: Verify treasury bytecode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build with solana-verify and compare bytecode
        run: bash ci/verify.sh

      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: treasury-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-output/
          if-no-files-found: warn
          retention-days: 30
